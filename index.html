    <style>
        :root {
            --void: #12121A;
            --charcoal: #1A1A22;
            --warm-gold: #C9963C;
            --crimson: #8B1E2F;
            --warm-white: #F0EDE6;
            --gold-glow: rgba(201, 150, 60, 0.15);
            --gold-glow-strong: rgba(201, 150, 60, 0.3);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--void);
            color: var(--warm-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle radial glow behind the content */
        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Gold "P" avatar */
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background: var(--void);
            border: 2px solid var(--warm-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.75rem;
            box-shadow: 0 0 30px var(--gold-glow), 0 0 60px rgba(201, 150, 60, 0.06);
            animation: fadeInDown 0.8s ease-out;
        }

        .avatar span {
            font-family: 'Michroma', sans-serif;
            font-size: 2rem;
            color: var(--warm-gold);
            line-height: 1;
        }

        /* Studio name */
        .studio-name {
            font-family: 'Michroma', sans-serif;
            font-size: clamp(0.85rem, 3.2vw, 1.1rem);
            color: var(--warm-gold);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        /* Tagline */
        .tagline {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.05rem;
            color: var(--warm-white);
            font-weight: 400;
            font-style: italic;
            margin-bottom: 0.5rem;
            opacity: 0.9;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* One-liner */
        .description {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--warm-white);
            font-weight: 300;
            opacity: 0.55;
            margin-bottom: 2.5rem;
            line-height: 1.5;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        /* Separator */
        .separator {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--warm-gold), transparent);
            margin-bottom: 2.5rem;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        /* Link buttons */
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            width: 100%;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            width: 100%;
            padding: 0.85rem 1.25rem;
            background: var(--charcoal);
            border: 1px solid rgba(201, 150, 60, 0.1);
            border-radius: 10px;
            color: var(--warm-white);
            text-decoration: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gold-glow) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-btn:hover {
            border-color: rgba(201, 150, 60, 0.35);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(201, 150, 60, 0.08);
        }

        .link-btn:hover::before {
            opacity: 1;
        }

        .link-btn:hover .link-icon svg {
            fill: var(--warm-gold);
        }

        .link-btn:hover .link-label {
            color: var(--warm-white);
        }

        .link-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .link-icon svg {
            width: 18px;
            height: 18px;
            fill: rgba(240, 237, 230, 0.45);
            transition: fill 0.3s ease;
        }

        .link-label {
            position: relative;
            z-index: 1;
            color: rgba(240, 237, 230, 0.8);
            transition: color 0.3s ease;
        }

        .link-arrow {
            margin-left: auto;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.3s ease;
        }

        .link-arrow svg {
            width: 14px;
            height: 14px;
            fill: var(--warm-gold);
        }

        .link-btn:hover .link-arrow {
            opacity: 0.6;
            transform: translateX(0);
        }

        /* Staggered entrance for links */
        .link-btn:nth-child(1) { animation: fadeInUp 0.6s ease-out 0.45s both; }
        .link-btn:nth-child(2) { animation: fadeInUp 0.6s ease-out 0.52s both; }
        .link-btn:nth-child(3) { animation: fadeInUp 0.6s ease-out 0.59s both; }
        .link-btn:nth-child(4) { animation: fadeInUp 0.6s ease-out 0.66s both; }
        .link-btn:nth-child(5) { animation: fadeInUp 0.6s ease-out 0.73s both; }
        .link-btn:nth-child(6) { animation: fadeInUp 0.6s ease-out 0.80s both; }
        .link-btn:nth-child(7) { animation: fadeInUp 0.6s ease-out 0.87s both; }
        .link-btn:nth-child(8) { animation: fadeInUp 0.6s ease-out 0.94s both; }
        .link-btn:nth-child(9) { animation: fadeInUp 0.6s ease-out 1.01s both; }
        .link-btn:nth-child(10) { animation: fadeInUp 0.6s ease-out 1.08s both; }

        /* Footer */
        .footer {
            margin-top: 3rem;
            font-size: 0.72rem;
            color: rgba(240, 237, 230, 0.2);
            letter-spacing: 0.06em;
            animation: fadeIn 1s ease-out 1.2s both;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            body {
                padding: 2.5rem 1.25rem;
            }

            .avatar {
                width: 68px;
                height: 68px;
                border-radius: 14px;
            }

            .avatar span {
                font-size: 1.75rem;
            }

            .link-btn {
                padding: 0.8rem 1.1rem;
                font-size: 0.88rem;
            }
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
